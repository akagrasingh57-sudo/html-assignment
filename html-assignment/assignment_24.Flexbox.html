<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #dbeafe, #eef2ff);
			color: #1f2937;
		}

		.login-card {
			width: min(100%, 400px);
			padding: 36px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 16px 40px rgb(31 41 55 / 12%);
		}

		h1 {
			margin: 0 0 8px;
			text-align: center;
			font-size: 1.8rem;
		}

		.subtitle {
			margin: 0 0 28px;
			text-align: center;
			color: #6b7280;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		label {
			display: flex;
			flex-direction: column;
			gap: 7px;
			font-weight: 600;
		}

		input {
			width: 100%;
			padding: 12px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			font: inherit;
		}

		input:focus {
			outline: 3px solid rgb(79 70 229 / 20%);
			border-color: #4f46e5;
		}

		.form-options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			font-size: 0.9rem;
		}

		.remember {
			display: flex;
			align-items: center;
			gap: 8px;
			font-weight: 400;
		}

		.remember input {
			width: auto;
			margin: 0;
		}

		a {
			color: #4f46e5;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		button {
			margin-top: 4px;
			padding: 13px;
			border: 0;
			border-radius: 8px;
			background: #4f46e5;
			color: #fff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		button:hover {
			background: #4338ca;
		}

		.signup {
			margin: 24px 0 0;
			text-align: center;
			color: #6b7280;
		}

		@media (max-width: 420px) {
			.login-card {
				padding: 28px 22px;
			}
		}
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Welcome back</h1>
		<p class="subtitle">Sign in to your account</p>
		<form action="#" method="post">
			<label for="email">Email address
				<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
			</label>
			<label for="password">Password
				<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
			</label>
			<div class="form-options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don't have an account? <a href="#">Create one</a></p>
	</main>
</body>
</html>
